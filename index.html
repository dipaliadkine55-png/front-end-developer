<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Web App - Week 3</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <div class="container header-container">
            <h1 class="logo">DevPortfolio</h1>
            <button id="menu-toggle" class="menu-toggle" aria-label="Toggle Navigation">☰</button>
            <nav id="nav-menu" class="nav-menu">
                <a href="#hero">Home</a>
                <a href="#features">Features</a>
                <a href="#contact">Contact</a>
                <button id="theme-toggle" class="theme-btn">🌙 Dark Mode</button>
            </nav>
        </div>
    </header>

    <main>
        <section id="hero" class="hero-section">
            <div class="container hero-content">
                <h2>Dynamic User Experiences</h2>
                <p>Enhancing web applications with DOM manipulation, event handling, and real-time validation.</p>
            </div>
        </section>

        <section id="contact" class="contact-section container">
            <h3>Get in Touch</h3>
            <form id="contact-form" class="contact-form" novalidate>
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" required>
                    <span class="error-message" id="name-error"></span>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required>
                    <span class="error-message" id="email-error"></span>
                </div>
                <button type="submit" class="btn">Send Message</button>
                <p id="form-success" class="success-message" style="display: none;">Thank you! Your message has been sent.</p>
            </form>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 Frontend Web Developer Intern.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
